<!doctype html>
<html lang="en">
<head>

<meta name="description" content="BorrowX — social borrowing, exchange and trusted community.">
<title>BorrowX — Borrow • Exchange • Connect</title>
<style>
:root{--bg:#0b0b16;--surface:#111225;--surface2:#171933;--surface3:#202347;--text:#f7f7ff;--muted:#a7aac4;--line:#292d50;--p:#7657ff;--p2:#c83dff;--pink:#ff4f9a;--cyan:#32d7ff;--green:#35d28b;--yellow:#ffd166;--red:#ff5b70;--shadow:0 18px 55px rgba(0,0,0,.32);--r:22px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#292060 0,transparent 32%),radial-gradient(circle at 90% 8%,#4a185d 0,transparent 28%),linear-gradient(145deg,#090912,#10122a 55%,#180d25);color:var(--text)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 70%,rgba(50,215,255,.06),transparent 28%)}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer;color:inherit}.app{min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:20;background:rgba(9,10,20,.76);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.07)}.topin{max-width:1180px;margin:auto;padding:13px 16px;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.5px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--p),var(--p2),var(--pink));display:grid;place-items:center;box-shadow:0 8px 25px rgba(118,87,255,.35)}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.6px}.topactions{margin-left:auto;display:flex;gap:8px}.iconbtn,.pillbtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);padding:10px 12px;border-radius:14px}.iconbtn{width:42px;height:42px;padding:0;display:grid;place-items:center}.hero{max-width:1180px;margin:20px auto 0;padding:0 16px}.heroCard{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:30px;padding:28px;background:linear-gradient(125deg,rgba(118,87,255,.26),rgba(200,61,255,.16) 42%,rgba(50,215,255,.09));box-shadow:var(--shadow)}.heroCard:after{content:"";position:absolute;width:240px;height:240px;right:-80px;top:-100px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--p));filter:blur(30px);opacity:.28}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.02;margin:0 0 12px;max-width:720px}.gradient{background:linear-gradient(90deg,#fff,#d7c9ff,#ffb4d9);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#c8c9dc;max-width:650px;line-height:1.55;margin:0 0 20px}.quick{display:flex;flex-wrap:wrap;gap:9px}.primary{background:linear-gradient(135deg,var(--p),var(--p2));padding:12px 16px;border-radius:15px;font-weight:800;box-shadow:0 10px 25px rgba(118,87,255,.28)}.secondary{background:rgba(255,255,255,.08);padding:12px 16px;border-radius:15px;font-weight:800;border:1px solid rgba(255,255,255,.08)}.nav{max-width:1180px;margin:16px auto 0;padding:0 16px;display:flex;gap:8px;overflow:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.05);color:#bbbdd3}.nav button.active{background:linear-gradient(135deg,rgba(118,87,255,.32),rgba(200,61,255,.2));color:#fff;border:1px solid rgba(255,255,255,.1)}.content{max-width:1180px;margin:18px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid2{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.sectionTitle h2{font-size:19px;margin:0}.muted{color:var(--muted)}.card{background:linear-gradient(145deg,rgba(20,22,45,.94),rgba(14,15,31,.96));border:1px solid rgba(255,255,255,.08);border-radius:var(--r);padding:16px;box-shadow:0 10px 35px rgba(0,0,0,.18)}.storyrow{display:flex;gap:13px;overflow:auto;padding:4px 2px 8px;scrollbar-width:none}.story{min-width:72px;text-align:center}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--p),var(--pink));border:2px solid rgba(255,255,255,.16);margin:auto}.story span{font-size:11px;color:#c3c5da;display:block;margin-top:7px;overflow:hidden;text-overflow:ellipsis}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:13px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}.stat b{display:block;font-size:20px}.stat small{color:var(--muted)}.feedCard{overflow:hidden;padding:0}.feedTop{padding:14px 16px;display:flex;align-items:center;gap:10px}.feedBody{padding:0 16px 12px}.feedMedia{height:260px;background:linear-gradient(135deg,#302269,#7d235f,#123b54);display:grid;place-items:center;font-size:54px;position:relative;overflow:hidden}.feedMedia video{width:100%;height:100%;object-fit:cover}.feedMedia .mediaTag{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.48);padding:6px 9px;border-radius:10px;font-size:11px}.feedActions{display:flex;gap:8px;padding:10px 16px;border-top:1px solid rgba(255,255,255,.06)}.feedActions button{background:transparent;padding:7px 9px;border-radius:11px;color:#c8cadc}.feedActions button:hover{background:rgba(255,255,255,.06)}.itemCard .thumb{height:130px;border-radius:17px;background:linear-gradient(135deg,#2d2762,#5a205b);display:grid;place-items:center;font-size:45px;margin-bottom:12px}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:9px;font-size:11px;font-weight:800;background:rgba(118,87,255,.16);color:#cfc7ff}.badge.ok{background:rgba(53,210,139,.13);color:#7af0ba}.badge.warn{background:rgba(255,209,102,.12);color:#ffe09a}.itemCard h3{margin:8px 0 5px;font-size:17px}.meta{font-size:12px;color:var(--muted);line-height:1.5}.cardActions{display:flex;gap:8px;margin-top:13px}.smallbtn{flex:1;padding:10px;border-radius:12px;background:rgba(255,255,255,.07);font-weight:750}.smallbtn.primary2{background:linear-gradient(135deg,var(--p),var(--p2))}.people{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.person{display:flex;gap:11px;align-items:center;padding:11px;border-radius:16px;background:rgba(255,255,255,.045)}.person .avatar{width:45px;height:45px;font-size:13px;flex:none}.person b{font-size:13px}.person small{color:var(--muted);display:block;margin-top:2px}.searchbar{display:flex;gap:8px}.searchbar input{flex:1}.input,.select,.textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#0b0d1c;color:#fff;outline:none}.textarea{min-height:90px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:#7963ff;box-shadow:0 0 0 3px rgba(118,87,255,.12)}.empty{text-align:center;padding:30px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(9,10,20,.88);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08)}.bottomin{max-width:650px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:4px}.bottom button{background:transparent;color:#a8aac0;padding:8px 4px;border-radius:14px;font-size:11px}.bottom button.active{color:#fff;background:rgba(118,87,255,.16)}.bottom .bi{display:block;font-size:21px;margin-bottom:2px}.modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65);padding:12px}.modal.show{display:flex}.sheet{width:min(620px,100%);max-height:90vh;overflow:auto;background:#111327;border:1px solid rgba(255,255,255,.1);border-radius:26px 26px 16px 16px;box-shadow:var(--shadow);padding:18px}.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheetHead h3{margin:0;font-size:20px}.x{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.07)}.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:7px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);color:#aaa}.tabs button.active{background:rgba(118,87,255,.2);color:#fff}.list{display:grid;gap:9px}.exchange{padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.035)}.exchangeTop{display:flex;align-items:center;gap:10px}.status{margin-left:auto;font-size:11px;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.08)}.chatbox{height:48vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px;background:#0a0c18;border-radius:17px}.msg{max-width:78%;padding:9px 11px;border-radius:15px;background:#20233e;color:#e9eaf5}.msg.me{align-self:flex-end;background:linear-gradient(135deg,#5f49e8,#9b36c4)}.composer{display:flex;gap:7px;margin-top:9px}.composer .input{flex:1}.callGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.callBox{height:190px;background:#05060c;border-radius:18px;overflow:hidden;position:relative}.callBox video{width:100%;height:100%;object-fit:cover}.callBox span{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);padding:5px 8px;border-radius:8px;font-size:11px}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#171a30;border:1px solid rgba(255,255,255,.1);padding:12px 15px;border-radius:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:100;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.hidden{display:none!important}.verified{color:#61d7ff}.danger{color:#ff8392}.notice{padding:12px;border-radius:14px;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.15);color:#f9dfa0;font-size:12px;line-height:1.5}.profileHero{display:flex;gap:15px;align-items:center}.bigAvatar{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,var(--p),var(--pink));display:grid;place-items:center;font-size:25px;font-weight:900}.handle{color:#bfc2d9;font-size:12px}.profileActions{display:flex;gap:8px;margin-top:14px}.comment{padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}@media(max-width:850px){.grid,.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.heroCard{padding:23px}.feedMedia{height:240px}}@media(min-width:851px){.bottom{display:none}.app{padding-bottom:30px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="topin"><div class="brand"><div class="logo">BX</div><div>BorrowX<small>BY JAY STYLE X1</small></div></div><div class="topactions"><button class="iconbtn" onclick="openSearch()">⌕</button><button class="iconbtn" onclick="openNotifications()">♢</button><button class="pillbtn" id="authBtn" onclick="openAuth()">Login</button></div></div></header>
<section class="hero"><div class="heroCard"><h1>Borrow smarter.<br><span class="gradient">Connect better.</span></h1><p>A social marketplace where people discover useful things, trusted people and real exchanges — all in one place.</p><div class="quick"><button class="primary" onclick="openPost('item')">＋ I Have Something</button><button class="secondary" onclick="openPost('need')">＋ I Need Something</button><button class="secondary" onclick="showPage('reels')">▶ Watch Reels</button></div></div></section>
<nav class="nav" id="desktopNav"><button data-page="home" class="active" onclick="showPage('home')">Home</button><button data-page="reels" onclick="showPage('reels')">Reels</button><button data-page="people" onclick="showPage('people')">People</button><button data-page="market" onclick="showPage('market')">Marketplace</button><button data-page="exchanges" onclick="showPage('exchanges')">Exchanges</button><button data-page="profile" onclick="showPage('profile')">Profile</button></nav>
<main class="content" id="content"></main>
</div>
<nav class="bottom"><div class="bottomin"><button data-b="home" class="active" onclick="showPage('home')"><span class="bi">⌂</span>Home</button><button data-b="reels" onclick="showPage('reels')"><span class="bi">▶</span>Reels</button><button data-b="market" onclick="showPage('market')"><span class="bi">＋</span>Post</button><button data-b="exchanges" onclick="showPage('exchanges')"><span class="bi">⇄</span>Exchanges</button><button data-b="profile" onclick="showPage('profile')"><span class="bi">◎</span>Profile</button></div></nav>
<div id="modalRoot"></div><div class="toast" id="toast"></div>
<script>
(function(){
window.$=id=>document.getElementById(id);window.escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
window.toast=(m)=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600)};
window.closeModal=()=>{const m=$('modalRoot');m.innerHTML=''};
window.modal=(title,body,buttons='')=>{$('modalRoot').innerHTML=`<div class="modal show" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheetHead"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>${body}${buttons}</div></div>`};
window.openAuth=()=>{modal('Welcome to BorrowX',`<div class="tabs"><button id="loginTab" class="active" onclick="authMode('login')">Login</button><button id="signupTab" onclick="authMode('signup')">Sign up</button></div><div id="authForm"><div class="form"><input class="input" id="authEmail" type="email" placeholder="Email"><input class="input" id="authPass" type="password" placeholder="Password"><button class="primary" onclick="submitAuth()">Continue</button><button class="secondary" onclick="resetPassword()">Forgot password?</button></div></div>`)};
window.authMode=(mode)=>{window._authMode=mode;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));$(mode==='login'?'loginTab':'signupTab').classList.add('active');$('authForm').innerHTML=`<div class="form">${mode==='signup'?'<input class="input" id="authName" placeholder="Your name">':''}<input class="input" id="authEmail" type="email" placeholder="Email"><input class="input" id="authPass" type="password" placeholder="Password"><button class="primary" onclick="submitAuth()">${mode==='login'?'Login':'Create account'}</button>${mode==='login'?'<button class="secondary" onclick="resetPassword()">Forgot password?</button>':''}</div>`};window._authMode='login';
window.openPost=(kind='item')=>{if(!window.currentUser){openAuth();toast('Please login first');return}modal(kind==='item'?'Post something you have':'Post something you need',`<div class="form"><input class="input" id="pName" placeholder="${kind==='item'?'Item name':'What do you need?'}"><div class="row"><select class="select" id="pCat"><option>Tools</option><option>Books</option><option>Camera</option><option>Sports</option><option>Games</option><option>Home</option><option>Electronics</option><option>Other</option></select><input class="input" id="pArea" placeholder="Approximate area"></div><input class="input" id="pDuration" placeholder="Duration e.g. 2 days"><textarea class="textarea" id="pDesc" placeholder="Describe condition, purpose or details"></textarea><button class="primary" onclick="savePost('${kind}')">Publish</button><div class="notice">For safety, use only an approximate area. Never post your home address or phone number.</div></div>`)};
window.showPage=(page)=>{window.page=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelectorAll('[data-b]').forEach(b=>b.classList.toggle('active',b.dataset.b===page));renderPage(page)};
window.renderPage=(page)=>{const c=$('content');if(page==='home')renderHome(c);else if(page==='reels')renderReels(c);else if(page==='people')renderPeople(c);else if(page==='market')renderMarket(c);else if(page==='exchanges')renderExchanges(c);else renderProfile(c)};
window.openSearch=()=>modal('Search BorrowX',`<div class="searchbar"><input class="input" id="globalSearch" placeholder="BorrowX ID, name or Instagram username"><button class="primary" onclick="doGlobalSearch()">Search</button></div><div id="searchResults" class="list" style="margin-top:12px"></div>`);
window.doGlobalSearch=async()=>{const q=($('globalSearch').value||'').trim().toLowerCase();if(!q){toast('Enter something to search');return}if(!window.db){$('searchResults').innerHTML='<div class="empty">Firebase is loading…</div>';return}try{const snap=await window.getDocs(window.query(window.collection(window.db,'profiles'),window.limit(80)));const arr=[];snap.forEach(d=>{const x=d.data();if([x.name,x.borrowId,x.instagram].some(v=>String(v||'').toLowerCase().includes(q)))arr.push({id:d.id,...x})});$('searchResults').innerHTML=arr.length?arr.map(personHtml).join(''):'<div class="empty">No matching people found.</div>'}catch(e){$('searchResults').innerHTML='<div class="empty">Search is temporarily unavailable.</div>'}};
window.personHtml=x=>`<div class="person"><div class="avatar">${initials(x.name||x.borrowId||'B')}</div><div style="flex:1"><b>${escapeHtml(x.name||'BorrowX member')} ${x.emailVerified?'✓':''}</b><small>@${escapeHtml(x.borrowId||'member')} ${x.instagram?' · IG: '+escapeHtml(x.instagram):''}</small></div><button class="smallbtn" onclick="openProfile('${x.id}')">View</button></div>`;
window.initials=s=>String(s).trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'BX';
window.renderHome=(c)=>{c.innerHTML=`<div class="sectionTitle"><h2>Community pulse</h2><button class="secondary" onclick="openNotifications()">🔔 Notifications</button></div><div class="storyrow" id="stories"><div class="story" onclick="openPost('item')"><div class="avatar">＋</div><span>Your update</span></div></div><div class="stats"><div class="stat"><b id="statItems">—</b><small>Things shared</small></div><div class="stat"><b id="statNeeds">—</b><small>Needs posted</small></div><div class="stat"><b id="statPeople">—</b><small>Community</small></div><div class="stat"><b>24/7</b><small>Exchange chat</small></div></div><div class="sectionTitle"><h2>Fresh from the community</h2><button class="secondary" onclick="showPage('market')">See all</button></div><div class="grid2"><div id="homeItems" class="grid"></div><div class="card"><h3 style="margin-top:0">Why BorrowX?</h3><p class="muted" style="line-height:1.6">Borrow useful things instead of buying every time. Build a trusted profile through real exchanges.</p><div class="notice">🛡 Approximate area only<br>💬 Protected in-app chat<br>📍 Public pickup recommended<br>🚫 Never share your home address</div></div></div><div class="sectionTitle"><h2>People to discover</h2><button class="secondary" onclick="showPage('people')">Explore</button></div><div id="homePeople" class="people"></div>`;loadHomeData()};
window.renderMarket=(c)=>{c.innerHTML=`<div class="sectionTitle"><h2>Marketplace</h2><button class="primary" onclick="openPost('item')">＋ Post</button></div><div class="searchbar"><input class="input" id="marketSearch" placeholder="Search items or categories"><button class="secondary" onclick="loadMarket()">Search</button></div><div class="sectionTitle"><h2>Items people can share</h2><span class="muted">Borrow • Exchange</span></div><div id="marketItems" class="grid"></div><div class="sectionTitle"><h2>People are looking for</h2></div><div id="marketNeeds" class="grid"></div>`;loadMarket()};
window.renderPeople=(c)=>{c.innerHTML=`<div class="sectionTitle"><h2>People</h2><button class="secondary" onclick="openSearch()">⌕ Search ID / Instagram</button></div><div class="card"><div class="searchbar"><input class="input" id="peopleSearch" placeholder="Search BorrowX ID, name, Instagram"><button class="primary" onclick="searchPeople()">Search</button></div></div><div class="sectionTitle"><h2>Community members</h2></div><div id="peopleGrid" class="people"></div>`;loadPeople()};
window.renderReels=(c)=>{c.innerHTML=`<div class="sectionTitle"><h2>Reels & community videos</h2><button class="primary" onclick="openVideoPost()">＋ Add video</button></div><div class="notice">Video uploads need Firebase Storage billing. Until Storage is enabled, BorrowX can still display public video URLs you add here.</div><div id="reelsGrid" style="display:grid;gap:14px;margin-top:12px"></div>`;loadReels()};
window.renderExchanges=(c)=>{c.innerHTML=`<div class="sectionTitle"><h2>Exchange Center</h2><button class="secondary" onclick="loadExchanges()">↻ Refresh</button></div><div class="tabs"><button id="recvTab" class="active" onclick="exchangeTab('received')">Received</button><button id="sentTab" onclick="exchangeTab('sent')">Sent</button></div><div id="exchangeList" class="list"></div>`;loadExchanges('received')};
window.renderProfile=(c)=>{if(!window.currentUser){c.innerHTML=`<div class="card empty"><div style="font-size:45px">◎</div><h2>Build your BorrowX identity</h2><p>Login to create your BorrowX ID, profile and exchange history.</p><button class="primary" onclick="openAuth()">Login / Sign up</button></div>`;return}c.innerHTML=`<div class="card"><div class="profileHero"><div class="bigAvatar" id="meAvatar">${initials(currentUser.email)}</div><div style="flex:1"><h2 id="meName" style="margin:0">BorrowX member</h2><div class="handle" id="meHandle">@loading</div><div class="handle" id="meIg"></div></div></div><div class="profileActions"><button class="primary" onclick="editProfile()">Edit profile</button><button class="secondary" onclick="signOutNow()">Logout</button></div></div><div class="sectionTitle"><h2>Your activity</h2></div><div class="stats"><div class="stat"><b id="myItems">—</b><small>My items</small></div><div class="stat"><b id="myNeeds">—</b><small>My needs</small></div><div class="stat"><b id="myEx">—</b><small>Exchanges</small></div><div class="stat"><b>Trusted</b><small>Profile status</small></div></div><div class="sectionTitle"><h2>Your public identity</h2></div><div id="profileDetails" class="card"></div>`;loadProfile()};
window.loadHomeData=async()=>{if(!window.db)return;try{const [is,ns,ps]=await Promise.all([getDocs(query(collection(db,'items'),limit(20))),getDocs(query(collection(db,'needs'),limit(20))),getDocs(query(collection(db,'profiles'),limit(20)))]);$('statItems').textContent=is.size;$('statNeeds').textContent=ns.size;$('statPeople').textContent=ps.size;let items=[];is.forEach(d=>items.push({id:d.id,...d.data()}));$('homeItems').innerHTML=items.slice(0,6).map(itemHtml).join('')||'<div class="empty">No items yet. Be the first to share.</div>';let people=[];ps.forEach(d=>people.push({id:d.id,...d.data()}));$('homePeople').innerHTML=people.slice(0,6).map(personHtml).join('')||'<div class="empty">No profiles yet.</div>'}catch(e){console.error(e)}};
window.itemHtml=x=>`<div class="card itemCard"><div class="thumb">${itemIcon(x.category)}</div><span class="badge">${escapeHtml(x.category||'Other')}</span> <span class="badge ok">${escapeHtml(x.mode||'Borrow')}</span><h3>${escapeHtml(x.itemName||x.needName||'Untitled')}</h3><div class="meta">📍 ${escapeHtml(x.area||'Approximate area')} · ⏱ ${escapeHtml(x.duration||'Flexible')}</div><div class="meta" style="margin-top:5px">${escapeHtml(x.description||'No description')}</div><div class="cardActions"><button class="smallbtn primary2" onclick="requestItem('${x.id}')">Request</button><button class="smallbtn" onclick="openOwner('${x.ownerId||''}')">Owner</button></div></div>`;
